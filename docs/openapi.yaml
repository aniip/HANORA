openapi: 3.1.0
info:
  title: HANORA CAFE API
  version: 1.0.0
  description: |
    Kontrak REST untuk sistem HANORA CAFE.

    Aturan utama:
    - Harga, PB1, dan total selalu dihitung di server.
    - Customer memesan sebagai guest melalui sesi QR meja.
    - Staf memakai JWT; refresh token disimpan di cookie httpOnly.
    - Webhook Midtrans diverifikasi dengan signature SHA-512.
    - Semua nominal dalam rupiah.
  contact:
    name: HANORA CAFE
servers:
  - url: https://hanora.example.com/api/v1
    description: Production (placeholder domain)
  - url: http://localhost:5080/api/v1
    description: Development lokal

tags:
  - name: Auth
  - name: Publik
  - name: Pemesanan
  - name: Pembayaran
  - name: Kasir
  - name: Owner
  - name: Sistem

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login staf (Owner/Kasir)
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil
          headers:
            Set-Cookie:
              description: Refresh token httpOnly
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotasi access token memakai refresh cookie
      operationId: refreshToken
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Token baru
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout dan cabut refresh token
      operationId: logout
      security:
        - bearerAuth: []
        - refreshCookie: []
      responses:
        '204':
          description: Logout berhasil
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Profil pengguna yang sedang login
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Ganti password staf
      description: Wajib jika mustChangePassword bernilai true. Mencabut refresh token lain.
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password berhasil diganti
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /public/site:
    get:
      tags: [Publik]
      summary: Profil bisnis dan konten website publik
      operationId: getPublicSite
      security: []
      responses:
        '200':
          description: Profil bisnis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSite'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /public/categories:
    get:
      tags: [Publik]
      summary: Kategori aktif
      operationId: getPublicCategories
      security: []
      responses:
        '200':
          description: Daftar kategori
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /public/products:
    get:
      tags: [Publik]
      summary: Produk yang tersedia
      operationId: getPublicProducts
      security: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
          description: Slug kategori
        - name: search
          in: query
          schema:
            type: string
            maxLength: 80
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Daftar produk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedProducts'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /public/products/{slug}:
    get:
      tags: [Publik]
      summary: Detail produk
      operationId: getPublicProduct
      security: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Detail produk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /public/tables/{qrToken}:
    get:
      tags: [Publik]
      summary: Validasi QR meja dan buat sesi meja
      operationId: resolveTableQr
      security: []
      parameters:
        - $ref: '#/components/parameters/QrToken'
      responses:
        '200':
          description: Sesi meja
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableSession'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /orders:
    post:
      tags: [Pemesanan]
      summary: Buat pesanan dari sesi meja
      description: |
        Harga, subtotal, PB1, dan total dihitung ulang di server.
        Header Idempotency-Key wajib dan harus unik per percobaan.
      operationId: createOrder
      security:
        - tableSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Pesanan dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Produk tidak tersedia atau konflik idempotency
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'

  /orders/track/{trackingToken}:
    get:
      tags: [Pemesanan]
      summary: Lacak status pesanan customer
      operationId: trackOrder
      security: []
      parameters:
        - $ref: '#/components/parameters/TrackingToken'
      responses:
        '200':
          description: Status pesanan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderTracking'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /orders/track/{trackingToken}/cancel:
    post:
      tags: [Pemesanan]
      summary: Batalkan pesanan sebelum diproses
      operationId: cancelOrder
      security: []
      parameters:
        - $ref: '#/components/parameters/TrackingToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '200':
          description: Pesanan dibatalkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderTracking'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /orders/track/{trackingToken}/payments/qris:
    post:
      tags: [Pembayaran]
      summary: Ulangi pembayaran QRIS
      description: Membuat payment attempt QRIS baru untuk pesanan yang belum dibayar.
      operationId: retryQrisPayment
      security: []
      parameters:
        - $ref: '#/components/parameters/TrackingToken'
      responses:
        '200':
          description: Payment attempt baru
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSummary'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'

  /orders/track/{trackingToken}/simulate:
    post:
      tags: [Pembayaran]
      summary: Simulasikan pembayaran QRIS
      description: |
        Hanya tersedia ketika Midtrans berjalan pada mode simulation.
        Menandai payment QRIS lunas, order menjadi processing, dan income dibuat.
      operationId: simulateQrisPayment
      security: []
      parameters:
        - $ref: '#/components/parameters/TrackingToken'
      responses:
        '200':
          description: Tracking pesanan setelah pembayaran disimulasikan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderTracking'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /webhooks/midtrans:
    post:
      tags: [Pembayaran]
      summary: Webhook notifikasi Midtrans
      description: |
        Tanpa JWT. Keamanan berasal dari signature SHA-512:
        SHA512(order_id + status_code + gross_amount + ServerKey).
        Duplikat diabaikan berdasarkan notification_hash.
      operationId: midtransWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MidtransNotification'
      responses:
        '200':
          description: Diterima atau duplikat
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: ok
        '401':
          description: Signature tidak valid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /cashier/orders:
    get:
      tags: [Kasir]
      summary: Antrean pesanan
      operationId: listCashierOrders
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Daftar pesanan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedCashierOrders'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /cashier/orders/{id}:
    get:
      tags: [Kasir]
      summary: Detail pesanan
      operationId: getCashierOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Detail pesanan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashierOrderDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /cashier/orders/{id}/status:
    patch:
      tags: [Kasir]
      summary: Ubah status pesanan
      operationId: updateCashierOrderStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
      responses:
        '200':
          description: Status diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashierOrderDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /cashier/orders/{id}/confirm-cash:
    post:
      tags: [Kasir]
      summary: Konfirmasi pembayaran tunai diterima
      operationId: confirmCashPayment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmCashRequest'
      responses:
        '200':
          description: Pembayaran dikonfirmasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashierOrderDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /cashier/orders/{id}/cancel:
    post:
      tags: [Kasir]
      summary: Batalkan pesanan dari sisi kasir
      operationId: cancelCashierOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelCashierOrderRequest'
      responses:
        '200':
          description: Pesanan dibatalkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashierOrderDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /cashier/transactions:
    get:
      tags: [Kasir]
      summary: Riwayat transaksi
      operationId: listCashierTransactions
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - name: method
          in: query
          schema:
            $ref: '#/components/schemas/PaymentMethod'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PaymentStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Daftar transaksi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedTransactions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /owner/dashboard/summary:
    get:
      tags: [Owner]
      summary: Ringkasan performa bisnis
      operationId: getDashboardSummary
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Ringkasan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /owner/dashboard/sales-trend:
    get:
      tags: [Owner]
      summary: Tren pendapatan
      operationId: getSalesTrend
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [day, month]
            default: day
      responses:
        '200':
          description: Titik data tren
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SalesTrendPoint'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /owner/dashboard/top-products:
    get:
      tags: [Owner]
      summary: Produk terlaris
      operationId: getTopProducts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Produk terlaris
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TopProduct'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /owner/dashboard/payment-methods:
    get:
      tags: [Owner]
      summary: Komposisi metode pembayaran
      operationId: getPaymentMethodBreakdown
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Komposisi pembayaran
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentMethodBreakdown'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /owner/categories:
    get:
      tags: [Owner]
      summary: Daftar kategori
      operationId: listCategories
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Kategori
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Owner]
      summary: Tambah kategori
      operationId: createCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Kategori dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /owner/categories/{id}:
    put:
      tags: [Owner]
      summary: Ubah kategori
      operationId: updateCategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Kategori diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Owner]
      summary: Hapus kategori
      operationId: deleteCategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Kategori dihapus
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /owner/products:
    get:
      tags: [Owner]
      summary: Daftar produk
      operationId: listProducts
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [available, unavailable, archived]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Daftar produk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedProducts'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Owner]
      summary: Tambah produk
      operationId: createProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: Produk dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /owner/products/{id}:
    get:
      tags: [Owner]
      summary: Detail produk
      operationId: getProduct
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Produk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Owner]
      summary: Ubah produk
      operationId: updateProduct
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: Produk diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Owner]
      summary: Arsipkan produk
      operationId: archiveProduct
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Produk diarsipkan
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /owner/products/{id}/availability:
    patch:
      tags: [Owner]
      summary: Ubah ketersediaan produk
      operationId: updateProductAvailability
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isAvailable]
              properties:
                isAvailable:
                  type: boolean
      responses:
        '200':
