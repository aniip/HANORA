components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token staf (Owner/Kasir), berlaku 15 menit.
    tableSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Sesi meja hasil scan QR, audience `table`, berlaku 2 jam.
    refreshCookie:
      type: apiKey
      in: cookie
      name: hanora_refresh
      description: Refresh token httpOnly, Secure, SameSite=Lax.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    QrToken:
      name: qrToken
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{20,64}$'
    TrackingToken:
      name: trackingToken
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{20,64}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    FromDate:
      name: from
      in: query
      schema:
        type: string
        format: date
      description: Tanggal awal (WIB), format YYYY-MM-DD.
    ToDate:
      name: to
      in: query
      schema:
        type: string
        format: date
      description: Tanggal akhir (WIB), inklusif.

  responses:
    BadRequest:
      description: Permintaan tidak valid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Tidak terautentikasi
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Tidak berhak
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Tidak ditemukan
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Konflik status/data
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: Terlalu banyak permintaan
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalError:
      description: Kesalahan server
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    BadGateway:
      description: Layanan pembayaran tidak dapat dihubungi
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 8
          maxLength: 128
        newPassword:
          type: string
          minLength: 12
          maxLength: 128

    LoginResponse:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          example: 900
        user:
          $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      required: [id, name, email, role, mustChangePassword]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [Owner, Cashier]
        mustChangePassword:
          type: boolean

    PublicSite:
      type: object
      properties:
        name:
          type: string
          example: HANORA CAFE
        tagline:
          type: string
        description:
          type: string
        address:
          type: string
        phone:
          type: string
        instagram:
          type: string
        openingHours:
          type: string
        mapsUrl:
          type: string
        logoUrl:
          type: string
        heroImageUrl:
          type: string
        gallery:
          type: array
          items:
            type: string

    Category:
      type: object
      required: [id, name, slug, isActive]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        sortOrder:
          type: integer
        isActive:
          type: boolean

    CategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        slug:
          type: string
          maxLength: 80
        sortOrder:
          type: integer
          minimum: 0
        isActive:
          type: boolean
          default: true

    Product:
      type: object
      required: [id, name, slug, price, isAvailable, category]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
          example: 32000
        imageUrl:
          type: string
        isAvailable:
          type: boolean
        category:
          $ref: '#/components/schemas/Category'

    ProductRequest:
      type: object
      required: [name, categoryId, price]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        categoryId:
          type: string
          format: uuid
        description:
          type: string
          maxLength: 2000
        price:
          type: number
          exclusiveMinimum: 0
        isAvailable:
          type: boolean
          default: true

    PagedProducts:
      type: object
      required: [items, page, pageSize, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer

    TableInfo:
      type: object
      required: [number, name]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          example: '01'
        name:
          type: string
          example: Meja 01
        capacity:
          type: integer

    TableSession:
      type: object
      required: [table, tableSessionToken, expiresIn]
      properties:
        table:
          $ref: '#/components/schemas/TableInfo'
        tableSessionToken:
          type: string
        expiresIn:
          type: integer
          example: 7200

    TableWithQr:
      allOf:
        - $ref: '#/components/schemas/TableInfo'
        - type: object
